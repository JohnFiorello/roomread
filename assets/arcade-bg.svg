<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop stop-color="#080b33"/><stop offset=".38" stop-color="#231050"/><stop offset=".7" stop-color="#5b0b58"/><stop offset="1" stop-color="#120522"/>
  </linearGradient>
  <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
    <stop stop-color="#170732"/><stop offset=".45" stop-color="#0b1540"/><stop offset="1" stop-color="#09071c"/>
  </linearGradient>
  <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
    <stop stop-color="#120b28"/><stop offset="1" stop-color="#050613"/>
  </linearGradient>
  <radialGradient id="moonGlow"><stop stop-color="#fff6bd" stop-opacity=".8"/><stop offset=".42" stop-color="#ffd875" stop-opacity=".18"/><stop offset="1" stop-color="#ff78bb" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="90" height="58" patternUnits="userSpaceOnUse"><path d="M90 0H0V58" fill="none" stroke="#7c3bc4" stroke-opacity=".24" stroke-width="2"/></pattern>
  <pattern id="fence" width="42" height="42" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0V42M21 0V42" stroke="#00d9ff" stroke-opacity=".34" stroke-width="2"/></pattern>
  <filter id="glowC"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="glowP"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>

<!-- sky -->
<rect width="1600" height="900" fill="url(#sky)"/>
