name: THAT TRACKS E2E

on:
  push:
    branches: [main]
    paths:
      - "next/**"
      - ".github/tests/that-tracks-e2e.js"
      - ".github/workflows/that-tracks-e2e.yml"
  workflow_dispatch:

jobs:
  multiplayer:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Playwright browsers
        run: |
          npm init -y
          npm install --save-dev playwright
          npx playwright install --with-deps chromium webkit
      - name: Run Chromium + iPhone WebKit multiplayer test
        run: node .github/tests/that-tracks-e2e.js
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: that-tracks-e2e
          path: that-tracks-*.png
          if-no-files-found: ignore
